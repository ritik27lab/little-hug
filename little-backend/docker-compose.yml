services:
  db:
    image: postgres:16
    container_name: little-log-db
    environment:
      POSTGRES_USER: little-hug
      POSTGRES_PASSWORD: little-hug
      POSTGRES_DB: little_log
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5433 on purpose, not 5432 — your native Postgres already holds
      # 5432 on your Mac. This just lets Beekeeper (or psql) connect to
      # the containerized db directly for inspection; the backend
      # container still talks to it via "db:5432" on the internal
      # network either way, unaffected by this mapping.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U little-hug -d little_log"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: little-log-backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL host. "db" is this compose file's
      # service name above — Docker Compose resolves it automatically on
      # the shared network, no IP/hostname wrangling needed.
      DATABASE_URL: "postgresql://little-hug:little-hug@db:5432/little_log?schema=public"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
