databases:
  - name: little-log-db
    databaseName: little_log
    plan: free

services:
  - type: web
    name: little-log-backend
    runtime: docker
    # Your repo is a monorepo (little-backend/ + app/ as siblings) — rootDir
    # tells Render everything below (Dockerfile path, build context) is
    # relative to little-backend/, not the repo root.
    rootDir: little-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's managed Postgres connection string, wired automatically —
      # no copy-pasting a DATABASE_URL by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: little-log-db
          property: connectionString
      # Render generates and stores these itself — you'll never see the
      # actual value, which is exactly what you want for a JWT secret.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      # sync: false = Render leaves this blank and prompts you to fill it
      # in from the Dashboard after the first deploy, instead of the real
      # secret ever touching this file (which you'll likely commit to git).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      # Fill this in after the first deploy, once you know your actual
      # assigned URL (e.g. https://little-log-backend.onrender.com/uploads)
      - key: PUBLIC_UPLOADS_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
    # Deliberately not setting PORT — Render injects its own PORT env var
    # automatically and expects the app to listen on it, which env.ts
    # already does (`process.env.PORT ?? 4000`). Setting it here would
    # override Render's value and break the health check.
